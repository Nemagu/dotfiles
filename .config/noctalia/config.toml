[bar.default]
center = [ "clock", "date", "media", "control-center" ]
end = [ "notifications", "keyboard_layout", "network", "bluetooth", "battery", "cpu", "ram", "temp", "tray" ]
font_family = "LiterationMono Nerd Font"
margin_ends = 0
radius = 0
shadow = false
start = [ "wallhaven", "workspaces" ]
widget_spacing = 7

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 600.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 900.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 720.0

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 799.50006103515625
    cy = 817.1820068359375
    output = "eDP-1"
    placement_height = 999.0
    placement_width = 1599.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[osd]
position = "top_right"
position_vertical = "top_right"

[plugin_settings."noctalia/wallhaven"]
download_dir = "/home/german/Pictures/wallpapers"

[plugin_settings."nzlov/daily-wallpaper"]
source = "nasa"

[plugins]
enabled = [ "noctalia/wallhaven", "goodroot/noctwhspr" ]

[shell]
date_format = "%A, %F"
font_family = "LiterationMono Nerd Font"
screen_time_enabled = true
settings_show_advanced = false
time_format = "{:%-I:%M %p}"

    [shell.launcher]
    categories = false
    compact = true
    pinned = [ "firefox" ]

    [shell.panel]
    launcher_placement = "attached"

    [shell.screenshot]
    confirm_region = true
    directory = "/home/german/Pictures/Screenshots"
    remember_last_region = true

[theme]
builtin = "Kanagawa"
community_palette = "Oxocarbon"
mode = "dark"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "alacritty", "btop", "foot", "helix", "niri", "umbriel" ]
    community_ids = [ "neovim", "tmux", "yazi" ]

[wallpaper.default]
path = "/home/german/Pictures/wallpapers/wallhaven-lnzv49.jpg"

[wallpaper.last]
path = "/home/german/Pictures/wallpapers/wallhaven-lnzv49.jpg"

[wallpaper.monitors.eDP-1]
path = "/home/german/Pictures/wallpapers/wallhaven-lnzv49.jpg"

[widget.clock]
format = "{:%-I:%M %p}"

[widget.date]
format = "{:%a %F}"

[widget.network]
show_label = false
show_vpn_label = true

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"
