[[language]]
name = "python"
language-id = "python"
roots = ["pyproject.toml", "uv.lock", ".git", ".venv/", "venv/"]
scope = "source.python"
injection-regex = "python"
file-types = ["py", "pyi"]
indent = {tab-width = 4, unit = "    "}
language-servers = ["basedpyright", "ruff", "codebook"]
auto-format = true
formatter = {command = "ruff", args = ["format", "-"]}

[[language]]
name = "markdown"
language-id = "markdown"
roots = [".git"]
language-servers = ["marksman", "markdown-oxide", "codebook", ]
auto-format = true
formatter = {command = "dprint", args = ["fmt", "--stdin %{buffer_name}"]}

[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.basedpyright.config]
basedpyright.analysis.diagnosticMode = "workspace"
basedpyright.analysis.typeCheckingMode = "standard"

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.ruff.config.settings.lint]
preview = true
extend-select = ["I", "RUF"]
ignore = ["RUF001", "RUF002"]

[language-server.ruff.config.settings.format]
preview = false

[language-server.codebook]
command = "codebook-lsp"
args = ["serve"]
